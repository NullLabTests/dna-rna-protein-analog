<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#0f0c29"/><stop offset="100%" stop-color="#24243e"/></linearGradient>
    <linearGradient id="s1" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#1a1a2e"/><stop offset="100%" stop-color="#16213e"/></linearGradient>
    <linearGradient id="s2" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#16213e"/><stop offset="100%" stop-color="#0f3460"/></linearGradient>
    <linearGradient id="s3" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#0f3460"/><stop offset="100%" stop-color="#533483"/></linearGradient>
    <linearGradient id="s4" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#533483"/><stop offset="100%" stop-color="#e94560"/></linearGradient>
    <linearGradient id="s5" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#e94560"/><stop offset="100%" stop-color="#f5a623"/></linearGradient>
    <linearGradient id="s6" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#f5a623"/><stop offset="100%" stop-color="#ffd700"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="900" height="400" fill="url(#bg)" rx="16"/>

  <text x="450" y="35" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="700" letter-spacing="3" filter="url(#glow)">PROMPT → GRAPH → EVOLUTION</text>
  <text x="450" y="53" text-anchor="middle" fill="#ffffff" font-size="11" opacity="0.4" letter-spacing="2">The ladder of agent abstraction layers</text>
  <line x1="80" y1="60" x2="820" y2="60" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>

  <!-- Step 1: Prompt Engineering -->
  <rect x="60" y="75" width="150" height="55" rx="8" fill="url(#s1)" stroke="#0f3460" stroke-width="1"/>
  <text x="135" y="97" text-anchor="middle" fill="#4fc3f7" font-size="11" font-weight="700">2023-24</text>
  <text x="135" y="118" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Prompt</text>

  <!-- Arrow -->
  <line x1="210" y1="102" x2="245" y2="102" stroke="#4fc3f7" stroke-width="2" opacity="0.5"/>
  <polygon points="245,98 253,102 245,106" fill="#4fc3f7" opacity="0.5"/>

  <!-- Step 2: Context Engineering -->
  <rect x="255" y="75" width="150" height="55" rx="8" fill="url(#s2)" stroke="#0f3460" stroke-width="1"/>
  <text x="330" y="97" text-anchor="middle" fill="#4fc3f7" font-size="11" font-weight="700">2024-25</text>
  <text x="330" y="118" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Context</text>

  <!-- Arrow -->
  <line x1="405" y1="102" x2="440" y2="102" stroke="#0abde3" stroke-width="2" opacity="0.5"/>
  <polygon points="440,98 448,102 440,106" fill="#0abde3" opacity="0.5"/>

  <!-- Step 3: Loop Engineering -->
  <rect x="450" y="75" width="150" height="55" rx="8" fill="url(#s3)" stroke="#533483" stroke-width="1"/>
  <text x="525" y="97" text-anchor="middle" fill="#a29bfe" font-size="11" font-weight="700">2025-mid26</text>
  <text x="525" y="118" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Loop</text>

  <!-- Arrow -->
  <line x1="600" y1="102" x2="635" y2="102" stroke="#a29bfe" stroke-width="2" opacity="0.5"/>
  <polygon points="635,98 643,102 635,106" fill="#a29bfe" opacity="0.5"/>

  <!-- Step 4: Graph Engineering -->
  <rect x="645" y="75" width="190" height="55" rx="8" fill="url(#s4)" stroke="#e94560" stroke-width="2"/>
  <text x="740" y="97" text-anchor="middle" fill="#ff6b6b" font-size="11" font-weight="700">mid-2026 →</text>
  <text x="740" y="118" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Graph</text>

  <!-- Biology analog row -->
  <text x="30" y="165" fill="#aaaaaa" font-size="10" font-weight="600" letter-spacing="2">BIOLOGICAL ANALOG</text>
  <line x1="30" y1="170" x2="870" y2="170" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>

  <!-- Protein -->
  <rect x="60" y="180" width="130" height="35" rx="6" fill="#ff9ff3" opacity="0.15" stroke="#ff9ff3" stroke-width="0.5" stroke-opacity="0.3"/>
  <text x="125" y="202" text-anchor="middle" fill="#ff9ff3" font-size="11">Single protein</text>

  <!-- RNA fold -->
  <rect x="255" y="180" width="130" height="35" rx="6" fill="#48dbfb" opacity="0.15" stroke="#48dbfb" stroke-width="0.5" stroke-opacity="0.3"/>
  <text x="320" y="202" text-anchor="middle" fill="#48dbfb" font-size="11">RNA localization</text>

  <!-- Transcription cycle -->
  <rect x="450" y="180" width="130" height="35" rx="6" fill="#a29bfe" opacity="0.15" stroke="#a29bfe" stroke-width="0.5" stroke-opacity="0.3"/>
  <text x="515" y="202" text-anchor="middle" fill="#a29bfe" font-size="11">Transcription cycle</text>

  <!-- GRN -->
  <rect x="645" y="180" width="190" height="35" rx="6" fill="#e94560" opacity="0.15" stroke="#e94560" stroke-width="0.5" stroke-opacity="0.3"/>
  <text x="740" y="202" text-anchor="middle" fill="#ff6b6b" font-size="11">Gene regulatory network</text>

  <!-- Control primitive row -->
  <text x="30" y="245" fill="#aaaaaa" font-size="10" font-weight="600" letter-spacing="2">CONTROL PRIMITIVE</text>
  <line x1="30" y1="250" x2="870" y2="250" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>

  <circle cx="135" cy="273" r="5" fill="#4fc3f7" opacity="0.5"/>
  <text x="145" y="277" fill="#4fc3f7" font-size="11">Instruction text</text>

  <circle cx="320" cy="273" r="5" fill="#0abde3" opacity="0.5"/>
  <text x="330" y="277" fill="#0abde3" font-size="11">Retrieval · Memory</text>

  <circle cx="515" cy="273" r="5" fill="#a29bfe" opacity="0.5"/>
  <text x="525" y="277" fill="#a29bfe" font-size="11">Trigger → Act → Verify → Retry</text>

  <circle cx="740" cy="273" r="5" fill="#e94560" opacity="0.5"/>
  <text x="750" y="277" fill="#e94560" font-size="11">Nodes · Edges · State</text>

  <!-- Future tiers -->
  <line x1="30" y1="295" x2="870" y2="295" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>

  <text x="450" y="318" text-anchor="middle" fill="#aaaaaa" font-size="10" font-weight="600" letter-spacing="2">EMERGING LAYERS</text>

  <!-- Dynamic Org -->
  <rect x="180" y="332" width="200" height="40" rx="8" fill="url(#s5)" opacity="0.4"/>
  <text x="280" y="357" text-anchor="middle" fill="#f5a623" font-size="11" font-weight="600">Dynamic Agent Org</text>

  <line x1="380" y1="352" x2="415" y2="352" stroke="#f5a623" stroke-width="1.5" opacity="0.4"/>
  <polygon points="415,348 423,352 415,356" fill="#f5a623" opacity="0.4"/>

  <!-- Evolution -->
  <rect x="425" y="332" width="200" height="40" rx="8" fill="url(#s6)" opacity="0.4"/>
  <text x="525" y="357" text-anchor="middle" fill="#ffd700" font-size="11" font-weight="600">Evolutionary Selection</text>

  <text x="30" y="385" fill="#ffffff" font-size="9" opacity="0.2">2023─────────────────────────────────────────────────────────────────────2026+</text>
</svg>