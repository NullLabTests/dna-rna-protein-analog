[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "belief-agent"
version = "2.0.0"
description = "Add explicit belief states, structured reflection loops, and human negotiation to any LLM agent"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
  {name = "Belief Agent Contributors"},
]
keywords = ["llm", "agent", "belief", "reasoning", "reflection", "negotiation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pydantic>=2.0.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.30.0"]
all = [
  "openai>=1.0.0",
  "anthropic>=0.30.0",
]
dev = [
  "pytest>=7.0",
  "pytest-asyncio>=0.21.0",
  "jupyter>=1.0.0",
  "nbformat>=5.0",
]

[project.urls]
Home = "https://github.com/anomalyco/belief-agent"
Source = "https://github.com/anomalyco/belief-agent"

[tool.hatch.build.targets.wheel]
packages = ["src/belief_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
